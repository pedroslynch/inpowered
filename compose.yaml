services:
  postgres:
    image: postgres:17
    container_name: inpowered-postgres
    environment:
      POSTGRES_DB: inpowered
      POSTGRES_USER: inpowered
      POSTGRES_PASSWORD: inpowered
    ports:
      - "5432:5432"
    volumes:
      - inpowered-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inpowered -d inpowered"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  inpowered-pgdata:
