<header class="navbar">
  <div class="navbar-inner">
    <a routerLink="/" class="home-link" aria-label="inPowered AI website"><app-logo /></a>

    <nav class="menu" aria-label="Main menu">
      @for (item of menu; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" class="nav-link">{{ item.label }}</a>
      }
    </nav>

    <div class="account">
      <span class="avatar" aria-hidden="true">{{ initials() }}</span>
      <div class="who">
        <span class="name">{{ user()?.fullName }}</span>
        <span class="role">{{ roleLabel() }}</span>
      </div>
      <button type="button" class="btn sign-out" (click)="signOut()" aria-label="Sign out">
        <app-icon name="log-out" [size]="16" />
        <span class="sign-out-label">Sign out</span>
      </button>
    </div>
  </div>
</header>

<main>
  <router-outlet />
</main>
